; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = m5stack-dial

[env:m5stack-dial]
platform = espressif32@8.0.0
board = m5stack-stamps3
framework = arduino
lib_deps = 
	m5stack/M5Unified
	m5stack/M5Dial
    m5stack/M5GFX
    https://github.com/micro-ROS/micro_ros_platformio.git#cfee17faffaa532363b7151dd13af6a85c69d3c1
board_microros_distro = jazzy
board_microros_transport = custom
board_microros_user_meta = microros.meta
extra_scripts =
    pre:scripts/build_timestamp.py
    pre:scripts/prepare_microros.py
build_unflags = -DARDUINO_USB_MODE=1
build_flags = 
	-D ARDUINO_USB_MODE=0
	-D ARDUINO_USB_CDC_ON_BOOT=0
    -D DIAL_ROS_DOMAIN_ID=0
    -D DIAL_AGENT_PORT=8888
upload_protocol = espota
upload_port = 192.168.77.1
upload_flags =
    --port=3232
    --host_port=3232
    --timeout=20

; Initial installation and recovery only. Hold G0 and reset before uploading.
[env:m5stack-dial-usb]
extends = env:m5stack-dial
upload_protocol = esptool
; Override the inherited OTA address and detect the OS-specific USB serial port.
upload_port =
upload_flags =
board_upload.after_reset = watchdog-reset

