# ここにNVIDIAコンテナが可能な場合の設定を書く(Jetson/Tegra環境向け)
# CSVモードで動作するため runtime: nvidia を指定する
# docker_util.sh でマージして使う

services:
  cub_ros:
    runtime: nvidia
    environment:
      - LD_LIBRARY_PATH=/opt/nvidia/l4t-gpu-libs/nvgpu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64

  cub_ros_vnc:
    runtime: nvidia
    environment:
      - LD_LIBRARY_PATH=/opt/nvidia/l4t-gpu-libs/nvgpu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64
