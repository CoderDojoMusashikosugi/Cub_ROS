topic_hz_checker:
  ros__parameters:
    hardware_id: cub4
    update_period: 1.0
    topics:
      # UM982 (/um982_node/fix, fix_secondary) は um982_node 自身の diagnostics で監視する
      imu:
        topic: "/imu/data_raw"
        type: "sensor_msgs/msg/Imu"
        expected_hz: 240.0
        tolerance: 0.2
        window_size: 10
        qos:
          reliability: best_effort
          durability: volatile
          depth: 1000
      odom:
        topic: "/odom"
        type: "nav_msgs/msg/Odometry"
        expected_hz: 20.0
        tolerance: 0.2
        window_size: 10
        qos:
          reliability: best_effort
          durability: volatile
          depth: 100
      dial:
        topic: "/dial/button"
        type: "std_msgs/msg/Bool"
        expected_hz: 10.0
        tolerance: 0.2
        window_size: 10
        qos:
          reliability: best_effort
          durability: volatile
          depth: 10
      # realsense:
      #   topic: "/camera/camera/color/camera_info"
