          depth: 100

linux_state:
  ros__parameters:
    hardware_id: cub4
    update_period: 1.0
    cpu:
      warn: 0.95
      error: 0.98
    memory:
      warn: 0.8
      error: 0.9
    swap:
      warn: 0.5
      error: 0.8
    storage:
      paths: ["/"]
      warn: 0.8
      error: 0.9
