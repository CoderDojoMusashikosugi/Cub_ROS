diagnostic_aggregator:
  ros__parameters:
    pub_rate: 1.0
    analyzers:
      system:
        type: diagnostic_aggregator/AnalyzerGroup
        path: Robot
        analyzers:
          sensors:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Sensors
            contains: [
              "TopicMonitor",
              "velodyne_points",
              "velodyne_packets",
              # "fix", # これだとfix topic statusも含まれてしまう
              "GPS Fix Status",
              "Joystick Driver Status",
            ]
            regex: [
              "^ublox_gps_node: fix$" # これならfixだけ取れる
            ]
          gnss:
            type: diagnostic_aggregator/GenericAnalyzer
            path: GNSS
            startswith: ["UM982"]
            # 一度も受信していなくても STALE として表示する（um982_node 未起動の検出）
            expected: [
              "UM982 Main Antenna",
              "UM982 Secondary Antenna",
            ]
            timeout: 5.0  # この秒数更新がなければ STALE（um982_node 停止の検出）
          linux:
            type: diagnostic_aggregator/GenericAnalyzer
            path: Linux
            contains: [
              # "Joystick Driver Status", #繋がってない間Errorになるので外してる
              "Linux CPU Usage",
              "Linux Memory Usage",
              "Linux Swap Usage",
              "Linux Storage Usage",
              "Jetson Thermal State"
            ]
