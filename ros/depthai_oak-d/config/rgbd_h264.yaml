# RGB (H264) + Depth. Use with: mode:=rgbd
/**:
  ros__parameters:
    pipeline_gen:
      i_pipeline_type: RGBD
      i_nn_type: none
    driver:
      i_enable_ir: false
    rgb:
      i_board_socket_id: 0
      i_width: 1280
      i_height: 720
      i_fps: 30.0
      i_low_bandwidth: true
      i_publish_compressed: true   # required for H264 (see rgb_h264.yaml)
      i_low_bandwidth_profile: 2   # H264_MAIN
      i_low_bandwidth_frame_freq: 30
    stereo:
      i_depth_preset: DEFAULT
      i_align_depth: true          # depth aligned to RGB
      i_width: 1280
      i_height: 720
      # Depth is published raw (16UC1). H264 is lossy and unsuitable for depth;
      # set i_low_bandwidth: true only if bandwidth is critical.
      i_low_bandwidth: false
